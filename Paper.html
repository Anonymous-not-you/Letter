  <body>
    <!-- SURPRISE SCREEN -->
    <div id="surprise-screen">
      <div class="cake-decoration">🎂</div>

      <div id="surprise-title">A Little Birthday Surprise 🎀</div>

      <div id="surprise-subtitle">Something special is waiting for you ✨</div>

        src="blue (Yung Kai) but it's chill instrumental.mp3"
        type="audio/mpeg"
      />

    <!-- MUSIC BUTTON -->
    <button id="audioToggle" class="audio-hint" type="button">
      🎵 Play Music
    </button>

    <!-- LETTER -->
    <div class="letter-container" id="letterWindow">
      <div class="letter-paper">
        <div class="letter-heading">Happy Birthday, Daizelle! 🎀✨</div>

        <div class="letter-subheading">Message for You</div>

        <div class="message" id="writingArea"></div>

        <button id="confessionButton" type="button">
          💗 There's Something I Want to Tell You
        </button>

        </div>

        <button id="readAgainButton" type="button">💌 Read Again</button>
      </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        /* =========================================================
         ELEMENTS
      ========================================================= */

        const surpriseScreen = document.getElementById("surprise-screen");

        const openLetterButton = document.getElementById("openLetterButton");

        const letterWindow = document.getElementById("letterWindow");

        const audioToggle = document.getElementById("audioToggle");

        const audio = document.getElementById("myAudio");

        const readAgainButton = document.getElementById("readAgainButton");

        const confessionButton = document.getElementById("confessionButton");

        const confessionSection = document.getElementById("confessionSection");

        const starCanvas = document.getElementById("star-canvas");

        const heartCanvas = document.getElementById("heart-canvas");

        const writingArea = document.getElementById("writingArea");

        const confessionArea = document.getElementById("confessionArea");

        /* =========================================================
         📱 CLOUDFLARE WORKER URL
      ========================================================= */

        const NOTIFICATION_URL =
          "https://birthday-notification.delacruzjm010.workers.dev/";

        /* =========================================================
         📱 SEND GITHUB NOTIFICATION
      ========================================================= */

        async function sendGitHubNotification() {
          try {
            if (!NOTIFICATION_URL) {
              console.error("❌ Cloudflare Worker URL is missing.");

              return;
            }

            console.log("📱 Sending birthday notification...");

            const response = await fetch(NOTIFICATION_URL, {
              method: "POST",

              headers: {
                "Content-Type": "application/json",
              },

              body: JSON.stringify({
                message: "🎀 Daizelle opened her birthday surprise! 💗",
              }),
            });

            const responseText = await response.text();

            if (!response.ok) {
              console.error(
                "❌ Notification failed:",
                response.status,
                responseText,
              );

              return;
            }

            console.log("✅ Birthday notification sent!", responseText);
          } catch (error) {
            console.error("❌ Notification error:", error);
          }
        }

        /* =========================================================
         CANVAS
      ========================================================= */

        const starCtx = starCanvas.getContext("2d");

        const heartCtx = heartCanvas.getContext("2d");

        /* =========================================================
         VARIABLES
      ========================================================= */

        let letterRevealed = false;

        let isPlaying = false;

        let heartsStarted = false;

        let writingStarted = false;

        let confessionStarted = false;

        /* =========================================================
         LETTER
      ========================================================= */

        const letterLines = [
          {
            text: "Dear Daizelle,",
            speed: 80,
            className: "greeting",
          },

          {
            text: "Happy birthday sayo Dol, Boi, Yahh!! Gusto ko lang sana kunin yung sandali na 'to para sabihin sayo na grateful ako dahil nakilala kita noon at naging isa sa mga kaibigan ko saka naging part ng buhay ko.",
            speed: 45,
            className: "",
          },

          {
            text: "Sa totoo lang, hindi ko inakalang noong una kitang makita or makilala na magiging kaibigan kita. Tanda ko pa na nagkakilala tayo dahil sa isang babaeng nakausap ko noon. Hindi ko ma-imagine na dahil sa babaeng 'yon, magiging kaibigan kita ehh.",
            speed: 45,
            className: "",
          },

          {
            text: "Hindi ko din ine-expect na sa mga pag-uusap natin na kahit minsan nagcha-chat ako bigla dahil wala akong makausap ay magiging makahulugan pala bilang isang pagkakaibigan na puno ng kwentuhan, tawanan, at mga katarantaduhan na pinaggagawa kapag magkakasama tayo nila Tala.",
            speed: 45,
            className: "",
          },

          {
            text: "Then wish ko sayo ay lahat ng dumating na pagsubok sayo ngayon malagpasan mo saka mas mapaligiran ka pa sana ng mga tao na makakasama sa journey mo. Then mabili mo muna yung pangarap mo (PHILIPPINES) 🙂",
            speed: 45,
            className: "",
          },
        ];

        /* =========================================================
         CONFESSION
      ========================================================= */

        const confessionLines = [
          {
            text: "Siguro sa part na 'to magiging medyo honest na ako sa'yo.",
            speed: 45,
            className: "",
          },

          {
            text: "Nung time umamin ako sa'yo after ng debut ni Tala, hindi pa ako sure nun. Pero after ng 2 weeks, na-realize ko na totoo pala na gusto talaga kita. Hindi ko lang magawa na aminin sa'yo or tanungin ka kung pwede kitang ligawan kasi ayoko na makaistorbo sa'yo dahil college na tayo at busy kana rin masyado. Sa totoo lang, gustong-gusto kita, pero hindi ko magawa na ipilit yung feelings ko dahil ayoko rin na mauwi tayo sa pagkawala ng friendship natin dahil sa love.",
            speed: 45,
            className: "",
          },
        ];

        /* =========================================================
         FINAL MESSAGE
      ========================================================= */

        const finalLines = [
          {
            text: "Wishing you a beautiful birthday and a wonderful year ahead. 💗",
            speed: 55,
            className: "closing",
          },

          {
            text: "Happy Birthday, Daizelle! 🎂💗",
            speed: 80,
            className: "final-message",
          },

          {
            text: "From your admirer ♡",
            speed: 70,
            className: "admirer-message",
          },
        ];

        /* =========================================================
         REVEAL LETTER
      ========================================================= */

        function revealBirthdayLetter() {
          if (letterRevealed) {
            return;
          }

          letterRevealed = true;

          surpriseScreen.style.display = "none";

          letterWindow.style.display = "block";

          audioToggle.style.display = "block";

          confessionButton.style.display = "none";

          confessionSection.style.display = "none";

          readAgainButton.style.display = "none";

          startHearts();

          setTimeout(function () {
            playMusicAutomatically();
          }, 300);

          setTimeout(function () {
            startWriting();
          }, 2300);
        }

        /* =========================================================
         💌 OPEN SURPRISE
      ========================================================= */

        openLetterButton.addEventListener("click", function () {
          // Send notification
          sendGitHubNotification();

          // Open the letter immediately
          revealBirthdayLetter();
        });

        /* =========================================================
         MUSIC
      ========================================================= */

        function playMusicAutomatically() {
          if (!letterRevealed) {
            return;
          }

          audio.volume = 0.9;

          audio.muted = false;

          const playPromise = audio.play();

          if (playPromise !== undefined) {
            playPromise

              .then(function () {
                isPlaying = true;

                audioToggle.textContent = "🔇 Mute Music";
              })

              .catch(function (error) {
                console.log("Autoplay was blocked by the browser.");

                console.log(error);

                isPlaying = false;

                audioToggle.textContent = "🎵 Play Music";
              });
          }
        }

        /* =========================================================
         START WRITING
      ========================================================= */

        async function startWriting() {
          if (writingStarted) {
            return;
          }

          writingStarted = true;

          writingArea.innerHTML = "";

          confessionArea.innerHTML = "";

          confessionSection.style.display = "none";

          confessionStarted = false;

          readAgainButton.style.display = "none";

          for (const line of letterLines) {
            await typeLine(writingArea, line.text, line.speed, line.className);
          }

          confessionButton.style.display = "block";
        }

        /* =========================================================
         START CONFESSION
      ========================================================= */

        async function startConfession() {
          if (confessionStarted) {
            return;
          }

          confessionStarted = true;

          confessionArea.innerHTML = "";

          readAgainButton.style.display = "none";

          for (const line of confessionLines) {
            await typeLine(
              confessionArea,
              line.text,
              line.speed,
              line.className,
            );
          }

          for (const line of finalLines) {
            await typeLine(
              confessionArea,
              line.text,
              line.speed,
              line.className,
            );
          }

          readAgainButton.style.display = "block";
        }

        /* =========================================================
         TYPE LINE
      ========================================================= */

        function typeLine(container, text, speed, className) {
          return new Promise(function (resolve) {
            const paragraph = document.createElement("p");

            paragraph.className = "type-line " + className;

            container.appendChild(paragraph);

            paragraph.classList.add("writing");

            let index = 0;

            function writeCharacter() {
              if (index < text.length) {
                paragraph.textContent += text.charAt(index);

                index++;

                setTimeout(writeCharacter, speed);
              } else {
                paragraph.classList.remove("writing");

                setTimeout(resolve, 500);
              }
            }

            writeCharacter();
          });
        }

        /* =========================================================
         CONFESSION BUTTON
      ========================================================= */

        confessionButton.addEventListener("click", function () {
          confessionButton.style.display = "none";

          confessionSection.style.display = "block";

          startConfession();
        });

        /* =========================================================
         READ AGAIN
      ========================================================= */

        readAgainButton.addEventListener("click", function () {
          writingStarted = false;

          confessionStarted = false;

          writingArea.innerHTML = "";

          confessionArea.innerHTML = "";

          confessionSection.style.display = "none";

          readAgainButton.style.display = "none";

          confessionButton.style.display = "none";

          startWriting();
        });

        /* =========================================================
         MUSIC BUTTON
      ========================================================= */

        audioToggle.addEventListener("click", function (event) {
          event.stopPropagation();

          if (audio.paused) {
            audio.volume = 0.9;

            audio.muted = false;

            const playPromise = audio.play();

            if (playPromise !== undefined) {
              playPromise

                .then(function () {
                  isPlaying = true;

                  audioToggle.textContent = "🔇 Mute Music";
                })

                .catch(function (error) {
                  console.error("Music could not play:", error);

                  isPlaying = false;

                  audioToggle.textContent = "🎵 Play Music";
                });
            }

            return;
          }

          if (audio.muted) {
            audio.muted = false;

            isPlaying = true;

            audioToggle.textContent = "🔇 Mute Music";
          } else {
            audio.muted = true;

            isPlaying = true;

            audioToggle.textContent = "🔊 Unmute Music";
          }
        });

        /* =========================================================
         STARS
      ========================================================= */

        const stars = [];

        const starCount = 100;

        function resizeCanvases() {
          starCanvas.width = window.innerWidth;

          starCanvas.height = window.innerHeight;

          heartCanvas.width = window.innerWidth;

          heartCanvas.height = window.innerHeight;
        }

        window.addEventListener("resize", resizeCanvases);

        resizeCanvases();

        for (let i = 0; i < starCount; i++) {
          stars.push({
            x: Math.random() * starCanvas.width,

            y: Math.random() * starCanvas.height,

            size: Math.random() * 1.8 + 0.4,

            opacity: Math.random(),

            speed: Math.random() * 0.02 + 0.005,
          });
        }

        function drawStars() {
          starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);

          stars.forEach(function (star) {
            star.opacity += star.speed;

            if (star.opacity >= 1 || star.opacity <= 0) {
              star.speed *= -1;
            }

            starCtx.beginPath();

            starCtx.arc(star.x, star.y, star.size, 0, Math.PI * 2);

            starCtx.fillStyle =
              "rgba(255, 160, 205, " + Math.abs(star.opacity) + ")";

            starCtx.fill();
          });

          requestAnimationFrame(drawStars);
        }

        drawStars();

        /* =========================================================
         HEARTS
      ========================================================= */

        const hearts = [];

        const heartCount = 35;

        for (let i = 0; i < heartCount; i++) {
          hearts.push({
            x: Math.random() * heartCanvas.width,

            y: Math.random() * heartCanvas.height + heartCanvas.height,

            size: Math.random() * 7 + 5,

            speed: Math.random() * 0.7 + 0.3,

            drift: (Math.random() - 0.5) * 0.4,

            opacity: Math.random() * 0.35 + 0.15,
          });
        }

        /* =========================================================
         DRAW HEART
      ========================================================= */

        function drawHeart(ctx, x, y, size, opacity) {
          ctx.save();

          ctx.translate(x, y);

          ctx.beginPath();

          ctx.moveTo(0, size * 0.3);

          ctx.bezierCurveTo(
            -size,
            -size * 0.3,
            -size * 0.8,
            -size,
            0,
            -size * 0.35,
          );

          ctx.bezierCurveTo(
            size * 0.8,
            -size,
            size,
            -size * 0.3,
            0,
            size * 0.3,
          );

          ctx.closePath();

          ctx.fillStyle = "rgba(255, 145, 195, " + opacity + ")";

          ctx.fill();

          ctx.restore();
        }

        /* =========================================================
         START HEARTS
      ========================================================= */

        function startHearts() {
          if (heartsStarted) {
            return;
          }

          heartsStarted = true;

          function animateHearts() {
            if (!letterRevealed) {
              return;
            }

            heartCtx.clearRect(0, 0, heartCanvas.width, heartCanvas.height);

            hearts.forEach(function (heart) {
              drawHeart(heartCtx, heart.x, heart.y, heart.size, heart.opacity);

              heart.y -= heart.speed;

              heart.x += heart.drift;

              if (heart.y < -30) {
                heart.y = heartCanvas.height + 30;

                heart.x = Math.random() * heartCanvas.width;
              }
            });

            requestAnimationFrame(animateHearts);
          }

          animateHearts();
        }
      });
    </script>
