<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Birthday Surprise 🎀</title>

    <style>
      /* =========================================================
   GENERAL
========================================================= */

      :root {
        --pink-light: #fff5fa;
        --pink-soft: #ffdce9;
        --pink: #f7a6c5;
        --pink-dark: #d66b98;
        --rose: #b84f7d;
        --deep-rose: #934064;
        --cream: #fffdfd;
        --text: #604453;
        --text-soft: #9b7185;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        overflow-x: hidden;

        font-family: Georgia, "Times New Roman", serif;

        color: var(--text);

        background:
          radial-gradient(
            circle at 15% 15%,
            rgba(255, 255, 255, 0.95),
            transparent 25%
          ),
          radial-gradient(
            circle at 85% 20%,
            rgba(255, 190, 220, 0.55),
            transparent 30%
          ),
          radial-gradient(
            circle at 50% 100%,
            rgba(255, 215, 232, 0.75),
            transparent 40%
          ),
          linear-gradient(135deg, #fff8fb, #ffeaf3 50%, #fff5f9);
      }

      /* =========================================================
   COUNTDOWN SCREEN
========================================================= */

      #countdown-screen {
        position: fixed;
        inset: 0;
        z-index: 50;

        min-height: 100vh;
        padding: 30px 20px;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        text-align: center;
        overflow: hidden;

        background:
          radial-gradient(
            circle at 50% 35%,
            rgba(255, 190, 220, 0.65),
            transparent 35%
          ),
          radial-gradient(
            circle at 10% 90%,
            rgba(255, 220, 235, 0.8),
            transparent 30%
          ),
          linear-gradient(145deg, #fff8fb, #ffe5f0 55%, #fff5f9);

        animation: fadeIn 1s ease;
      }

      #countdown-screen::before {
        content: "🎀";

        position: absolute;
        top: 8%;
        left: 8%;

        font-size: clamp(35px, 7vw, 70px);

        opacity: 0.65;

        transform: rotate(-15deg);
      }

      #countdown-screen::after {
        content: "🎂";

        position: absolute;
        right: 8%;
        bottom: 10%;

        font-size: clamp(40px, 8vw, 80px);

        opacity: 0.7;

        transform: rotate(8deg);
      }

      /* =========================================================
   CAKE
========================================================= */

      .cake-decoration {
        font-size: clamp(45px, 8vw, 75px);

        margin-bottom: 12px;

        filter: drop-shadow(0 8px 12px rgba(190, 80, 130, 0.18));

        animation: cakeFloat 3s ease-in-out infinite;
      }

      /* =========================================================
   COUNTDOWN TITLE
========================================================= */

      #countdown-title {
        color: var(--rose);

        font-size: clamp(27px, 5vw, 46px);

        font-weight: bold;

        text-shadow: 0 4px 15px rgba(190, 80, 130, 0.18);
      }

      #countdown-subtitle {
        margin-top: 7px;
        margin-bottom: 15px;

        color: var(--text-soft);

        font-size: clamp(13px, 2vw, 17px);

        letter-spacing: 1px;
      }

      /* =========================================================
   TARGET DATE
========================================================= */

      #birthday-date {
        margin-bottom: 22px;

        color: var(--rose);

        font-size: clamp(17px, 3vw, 25px);

        font-weight: bold;

        letter-spacing: 1px;

        text-shadow: 0 3px 10px rgba(190, 80, 130, 0.15);
      }

      /* =========================================================
   COUNTDOWN TIMER
========================================================= */

      #countdown-timer {
        min-width: 330px;

        margin-top: 4px;
        padding: 20px 32px;

        color: #a84976;

        background: rgba(255, 255, 255, 0.85);

        border: 2px solid rgba(255, 150, 195, 0.38);

        border-radius: 24px;

        font-size: clamp(27px, 6vw, 44px);

        font-weight: bold;

        letter-spacing: 2px;

        box-shadow:
          0 15px 40px rgba(190, 80, 130, 0.13),
          inset 0 0 25px rgba(255, 255, 255, 0.8);

        animation: timerPulse 2s infinite;
      }

      /* =========================================================
   CANVAS
========================================================= */

      #star-canvas,
      #heart-canvas {
        position: fixed;

        inset: 0;

        width: 100%;
        height: 100%;

        pointer-events: none;
      }

      #star-canvas {
        z-index: 1;
      }

      #heart-canvas {
        z-index: 2;
      }

      /* =========================================================
   LETTER CONTAINER
========================================================= */

      .letter-container {
        position: relative;

        z-index: 10;

        width: 900px;
        max-width: 92%;

        margin: 70px auto;

        display: none;

        animation: letterContainerReveal 1.5s ease;
      }

      /* =========================================================
   LETTER PAPER
========================================================= */

      .letter-paper {
        position: relative;

        width: 82%;
        max-width: 760px;

        margin: 0 auto;

        padding: 55px 65px 60px;

        background: linear-gradient(180deg, #fffefe, #fff8fb);

        border-radius: 8px;

        box-shadow:
          0 25px 60px rgba(150, 65, 105, 0.22),
          0 0 35px rgba(255, 150, 195, 0.15);

        border: 1px solid rgba(220, 150, 180, 0.25);

        opacity: 0;

        transform: translateY(35px);

        animation: letterAppear 1.8s ease forwards;

        animation-delay: 0.3s;
      }

      /* =========================================================
   PAPER DECORATIONS
========================================================= */

      .letter-paper::before {
        content: "♡";

        position: absolute;

        top: 18px;
        left: 24px;

        color: #f3a4c4;

        font-size: 28px;
      }

      .letter-paper::after {
        content: "♡";

        position: absolute;

        top: 18px;
        right: 24px;

        color: #f3a4c4;

        font-size: 28px;
      }

      /* =========================================================
   LETTER HEADING
========================================================= */

      .letter-heading {
        text-align: center;

        color: #c95487;

        font-size: clamp(28px, 5vw, 43px);

        font-weight: bold;

        margin-bottom: 8px;

        text-shadow: 0 4px 12px rgba(210, 90, 145, 0.18);
      }

      .letter-subheading {
        text-align: center;

        color: #a8798d;

        font-size: 14px;

        letter-spacing: 2px;

        margin-bottom: 35px;
      }

      /* =========================================================
   MESSAGE AREA
========================================================= */

      .message {
        color: #684d5b;

        font-family: "Times New Roman", Times, serif;

        font-size: 17px;

        line-height: 1.9;

        text-align: left;

        letter-spacing: 0.1px;
      }

      /* =========================================================
   EACH TYPED LINE
========================================================= */

      .type-line {
        position: relative;

        margin-bottom: 22px;

        min-height: 32px;
      }

      /* =========================================================
   WRITING CURSOR
========================================================= */

      .type-line.writing::after {
        content: "";

        display: inline-block;

        width: 2px;

        height: 1.1em;

        margin-left: 3px;

        vertical-align: -2px;

        background: #c95487;

        animation: blinkCursor 0.7s infinite;
      }

      /* =========================================================
   GREETING
========================================================= */

      .greeting {
        color: #9d456c;

        font-weight: bold;

        font-size: 18px;
      }

      /* =========================================================
   CLOSING
========================================================= */

      .closing {
        margin-top: 35px;

        text-align: center;

        color: #8e5c72;

        font-style: italic;

        line-height: 1.8;

        min-height: 35px;
      }

      /* =========================================================
   FINAL MESSAGE
========================================================= */

      .final-message {
        margin-top: 25px;

        text-align: center;

        color: #c05687;

        font-size: 21px;

        font-weight: bold;

        font-style: normal;

        min-height: 40px;
      }

      /* =========================================================
   FROM YOUR ADMIRER
========================================================= */

      .admirer-message {
        margin-top: 8px;

        text-align: center;

        color: #9d456c;

        font-family: "Times New Roman", Times, serif;

        font-size: 16px;

        font-style: italic;

        letter-spacing: 0.5px;

        min-height: 30px;
      }

      /* =========================================================
   READ AGAIN BUTTON
========================================================= */

      #readAgainButton {
        display: none;

        margin: 25px auto 0;

        padding: 11px 24px;

        color: #a84976;

        background: rgba(255, 245, 249, 0.95);

        border: 1px solid rgba(220, 110, 160, 0.35);

        border-radius: 30px;

        font-family: Georgia, "Times New Roman", serif;

        font-size: 14px;

        font-weight: bold;

        cursor: pointer;

        box-shadow: 0 8px 25px rgba(150, 65, 105, 0.15);

        transition: 0.25s ease;
      }

      #readAgainButton:hover {
        transform: translateY(-2px);

        background: #fff;

        box-shadow: 0 10px 30px rgba(210, 90, 145, 0.2);
      }

      #readAgainButton:active {
        transform: scale(0.96);
      }

      /* =========================================================
   MUSIC BUTTON
========================================================= */

      .audio-hint {
        position: fixed;

        right: 22px;
        bottom: 22px;

        z-index: 1000;

        display: none;

        padding: 11px 18px;

        color: #a84976;

        background: rgba(255, 245, 249, 0.95);

        border: 1px solid rgba(220, 110, 160, 0.3);

        border-radius: 30px;

        font-family: Georgia, "Times New Roman", serif;

        font-weight: bold;

        cursor: pointer;

        box-shadow: 0 8px 25px rgba(150, 65, 105, 0.15);

        transition: 0.25s ease;
      }

      .audio-hint:hover {
        transform: translateY(-2px);

        background: #fff;

        box-shadow: 0 10px 30px rgba(210, 90, 145, 0.2);
      }

      .audio-hint:active {
        transform: scale(0.96);
      }

      /* =========================================================
   ANIMATIONS
========================================================= */

      @keyframes fadeIn {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      @keyframes letterContainerReveal {
        from {
          opacity: 0;

          transform: translateY(40px) scale(0.96);
        }

        to {
          opacity: 1;

          transform: translateY(0) scale(1);
        }
      }

      @keyframes letterAppear {
        from {
          opacity: 0;

          transform: translateY(40px);
        }

        to {
          opacity: 1;

          transform: translateY(0);
        }
      }

      @keyframes cakeFloat {
        0%,
        100% {
          transform: translateY(0) rotate(-2deg);
        }

        50% {
          transform: translateY(-8px) rotate(2deg);
        }
      }

      @keyframes timerPulse {
        0%,
        100% {
          transform: scale(1);
        }

        50% {
          transform: scale(1.025);
        }
      }

      @keyframes blinkCursor {
        0%,
        45% {
          opacity: 1;
        }

        46%,
        100% {
          opacity: 0;
        }
      }

      /* =========================================================
   MOBILE
========================================================= */

      @media (max-width: 700px) {
        #countdown-screen {
          padding: 25px 15px;
        }

        #countdown-title {
          font-size: 25px;
        }

        #countdown-subtitle {
          font-size: 12px;
        }

        #birthday-date {
          font-size: 18px;

          margin-bottom: 18px;
        }

        #countdown-timer {
          width: 90%;

          min-width: 0;

          padding: 17px 12px;

          font-size: 25px;
        }

        .letter-container {
          width: 95%;

          margin: 45px auto;
        }

        .letter-paper {
          width: 92%;

          padding: 45px 25px 45px;
        }

        .letter-heading {
          font-size: 29px;
        }

        .letter-subheading {
          font-size: 11px;

          margin-bottom: 28px;
        }

        .message {
          font-size: 15px;

          line-height: 1.8;

          font-family: "Times New Roman", Times, serif;
        }

        .type-line {
          margin-bottom: 19px;

          min-height: 28px;
        }

        .greeting {
          font-size: 16px;
        }

        .closing {
          font-size: 14px;
        }

        .final-message {
          font-size: 18px;
        }

        .admirer-message {
          font-size: 14px;
        }

        #readAgainButton {
          font-size: 13px;

          padding: 9px 20px;
        }

        .audio-hint {
          right: 12px;

          bottom: 12px;

          padding: 9px 14px;

          font-size: 12px;
        }
      }

      @media (max-width: 400px) {
        .letter-paper {
          padding: 40px 20px;
        }

        .letter-heading {
          font-size: 25px;
        }

        .message {
          font-size: 14px;

          font-family: "Times New Roman", Times, serif;
        }
      }
    </style>
  </head>

  <body>
    <!-- =========================================================
     COUNTDOWN
========================================================= -->

    <div id="countdown-screen">
      <div class="cake-decoration">🎂</div>

      <div id="countdown-title">A Little Birthday Surprise 🎀</div>

      <div id="countdown-subtitle">Something special is waiting for you ✨</div>

      <div id="birthday-date">Loading date...</div>

      <div id="countdown-timer">00m : 00s</div>
    </div>

    <!-- =========================================================
     BACKGROUND CANVAS
========================================================= -->

    <canvas id="star-canvas"></canvas>
    <canvas id="heart-canvas"></canvas>

    <!-- =========================================================
     🎵 BACKGROUND MUSIC
========================================================= -->

    <audio id="myAudio" loop preload="auto">
      <source
        src="blue (Yung Kai) but it's chill instrumental.mp3"
        type="audio/mpeg"
      />
    </audio>

    <!-- =========================================================
     🎵 MUSIC BUTTON
========================================================= -->

    <button id="audioToggle" class="audio-hint" type="button">
      🎵 Play Music
    </button>

    <!-- =========================================================
     LETTER
========================================================= -->

    <div class="letter-container" id="letterWindow">
      <div class="letter-paper">
        <div class="letter-heading">Happy Birthday, Daizelle! 🎀✨</div>

        <div class="letter-subheading">A heartfelt birthday message</div>

        <div class="message" id="writingArea"></div>

        <!-- READ AGAIN BUTTON -->

        <button id="readAgainButton" type="button">💌 Read Again</button>
      </div>
    </div>

    <script>
      /* =========================================================
   🎯 BIRTHDAY DATE AND TIME
========================================================= */

      const birthdayDate = "2026-09-09";

      const birthdayTime = "04:46:00";

      /* =========================================================
   CREATE TARGET DATE
========================================================= */

      const targetDate = new Date(birthdayDate + "T" + birthdayTime).getTime();

      /* =========================================================
   GET ELEMENTS
========================================================= */

      const countdownScreen = document.getElementById("countdown-screen");

      const countdownTimer = document.getElementById("countdown-timer");

      const birthdayDateDisplay = document.getElementById("birthday-date");

      const letterWindow = document.getElementById("letterWindow");

      const audioToggle = document.getElementById("audioToggle");

      const audio = document.getElementById("myAudio");

      const readAgainButton = document.getElementById("readAgainButton");

      const starCanvas = document.getElementById("star-canvas");

      const heartCanvas = document.getElementById("heart-canvas");

      const starCtx = starCanvas.getContext("2d");

      const heartCtx = heartCanvas.getContext("2d");

      /* =========================================================
   VARIABLES
========================================================= */

      let letterRevealed = false;

      let countdownInterval = null;

      let isPlaying = false;

      let heartsStarted = false;

      /* =========================================================
   ✉️ LETTER CONTENT
========================================================= */

      const letterLines = [
        {
          text: "Dear Daizelle,",

          speed: 80,

          className: "greeting",
        },

        {
          text: "Happy Birthday to a special and hard-working girl! I hope you take a break from all your lectures, assignments and exams today to celebrate fully.",

          speed: 45,

          className: "",
        },

        {
          text: "It is so inspiring to watch you balance your college life while you always keep a positive and bright attitude. You truly bring a lot of energy into the room and I feel so lucky to know you.",

          speed: 45,

          className: "",
        },

        {
          text: "I hope your birthday is filled with your people, tasty food and a big slice of cake. May the year bring you closer to all your biggest academic goals and personal dreams.",

          speed: 45,

          className: "",
        },

        {
          text: "You deserve all the happiness in the world today and every day after. Have a wonderful birthday celebration tonight! 🎉",

          speed: 45,

          className: "",
        },

        {
          text: "Wishing you a beautiful birthday and a wonderful year ahead. 💗",

          speed: 55,

          className: "closing",
        },

        {
          text: "Happy Birthday, Daizelle! 🎂💗",

          speed: 80,

          className: "final-message",
        },

        {
          text: "From your admirer ♡",

          speed: 70,

          className: "admirer-message",
        },
      ];

      /* =========================================================
   SHOW BIRTHDAY DATE
========================================================= */

      function displayBirthdayDate() {
        const date = new Date(birthdayDate + "T00:00:00");

        birthdayDateDisplay.textContent = date.toLocaleDateString("en-US", {
          month: "long",

          day: "numeric",

          year: "numeric",
        });
      }

      displayBirthdayDate();

      /* =========================================================
   COUNTDOWN
========================================================= */

      function updateCountdown() {
        const now = Date.now();

        const difference = targetDate - now;

        if (difference <= 0) {
          countdownTimer.textContent = "00m : 00s";

          revealBirthdayLetter();

          return;
        }

        const totalSeconds = Math.ceil(difference / 1000);

        const days = Math.floor(totalSeconds / 86400);

        const hours = Math.floor((totalSeconds % 86400) / 3600);

        const minutes = Math.floor((totalSeconds % 3600) / 60);

        const seconds = totalSeconds % 60;

        if (days > 0) {
          countdownTimer.textContent =
            `${String(days).padStart(2, "0")}D : ` +
            `${String(hours).padStart(2, "0")}h : ` +
            `${String(minutes).padStart(2, "0")}m : ` +
            `${String(seconds).padStart(2, "0")}s`;
        } else {
          countdownTimer.textContent =
            `${String(hours).padStart(2, "0")}h : ` +
            `${String(minutes).padStart(2, "0")}m : ` +
            `${String(seconds).padStart(2, "0")}s`;
        }
      }

      /* =========================================================
   START COUNTDOWN
========================================================= */

      updateCountdown();

      countdownInterval = setInterval(updateCountdown, 250);

      /* =========================================================
   💌 REVEAL LETTER
========================================================= */

      function revealBirthdayLetter() {
        if (letterRevealed) {
          return;
        }

        letterRevealed = true;

        if (countdownInterval !== null) {
          clearInterval(countdownInterval);

          countdownInterval = null;
        }

        /* Hide countdown */

        countdownScreen.style.display = "none";

        /* Show letter */

        letterWindow.style.display = "block";

        /* Show music button */

        audioToggle.style.display = "block";

        /* Hide Read Again until writing is finished */

        readAgainButton.style.display = "none";

        /* Start floating hearts */

        startHearts();

        /* =====================================================
       🎵 MUSIC
    ===================================================== */

        setTimeout(() => {
          tryPlayMusic();
        }, 1000);

        /* =====================================================
       ✍️ TYPEWRITER
    ===================================================== */

        setTimeout(() => {
          startWriting();
        }, 2300);
      }

      /* =========================================================
   ✍️ START WRITING
========================================================= */

      async function startWriting() {
        const writingArea = document.getElementById("writingArea");

        /* Make the letter blank */

        writingArea.innerHTML = "";

        /* Hide button while writing */

        readAgainButton.style.display = "none";

        /* Type one paragraph at a time */

        for (const line of letterLines) {
          await typeLine(writingArea, line.text, line.speed, line.className);
        }

        /* Show Read Again after everything is finished */

        readAgainButton.style.display = "block";
      }

      /* =========================================================
   ✍️ TYPE ONE LINE
========================================================= */

      function typeLine(container, text, speed, className) {
        return new Promise((resolve) => {
          const paragraph = document.createElement("p");

          paragraph.className = "type-line " + className;

          container.appendChild(paragraph);

          /* Start cursor */

          paragraph.classList.add("writing");

          let index = 0;

          function writeCharacter() {
            if (index < text.length) {
              paragraph.textContent += text.charAt(index);

              index++;

              setTimeout(writeCharacter, speed);
            } else {
              paragraph.classList.remove("writing");

              setTimeout(resolve, 500);
            }
          }

          writeCharacter();
        });
      }

      /* =========================================================
   💌 READ AGAIN
========================================================= */

      readAgainButton.addEventListener("click", () => {
        startWriting();
      });

      /* =========================================================
   🎵 TRY AUTOMATIC MUSIC
========================================================= */

      function tryPlayMusic() {
        if (!letterRevealed) {
          return;
        }

        audio.volume = 0.9;

        audio
          .play()
          .then(() => {
            isPlaying = true;

            audioToggle.textContent = "🔇 Pause Music";
          })
          .catch(() => {
            isPlaying = false;

            audioToggle.textContent = "🎵 Play Music";
          });
      }

      /* =========================================================
   🎵 MUSIC BUTTON
========================================================= */

      audioToggle.addEventListener("click", (event) => {
        event.stopPropagation();

        if (!isPlaying) {
          audio.volume = 0.9;

          audio
            .play()
            .then(() => {
              isPlaying = true;

              audioToggle.textContent = "🔇 Pause Music";
            })
            .catch(() => {
              audioToggle.textContent = "🎵 Play Music";
            });
        } else {
          audio.pause();

          isPlaying = false;

          audioToggle.textContent = "🎵 Play Music";
        }
      });

      /* =========================================================
   ⭐ STARS
========================================================= */

      const stars = [];

      const starCount = 100;

      function resizeCanvases() {
        starCanvas.width = window.innerWidth;

        starCanvas.height = window.innerHeight;

        heartCanvas.width = window.innerWidth;

        heartCanvas.height = window.innerHeight;
      }

      window.addEventListener("resize", resizeCanvases);

      resizeCanvases();

      /* =========================================================
   CREATE STARS
========================================================= */

      for (let i = 0; i < starCount; i++) {
        stars.push({
          x: Math.random() * starCanvas.width,

          y: Math.random() * starCanvas.height,

          size: Math.random() * 1.8 + 0.4,

          opacity: Math.random(),

          speed: Math.random() * 0.02 + 0.005,
        });
      }

      /* =========================================================
   DRAW STARS
========================================================= */

      function drawStars() {
        starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);

        stars.forEach((star) => {
          star.opacity += star.speed;

          if (star.opacity >= 1 || star.opacity <= 0) {
            star.speed *= -1;
          }

          starCtx.beginPath();

          starCtx.arc(star.x, star.y, star.size, 0, Math.PI * 2);

          starCtx.fillStyle = `rgba(
                    255,
                    160,
                    205,
                    ${Math.abs(star.opacity)}
                )`;

          starCtx.fill();
        });

        requestAnimationFrame(drawStars);
      }

      drawStars();

      /* =========================================================
   💗 HEARTS
========================================================= */

      const hearts = [];

      const heartCount = 35;

      for (let i = 0; i < heartCount; i++) {
        hearts.push({
          x: Math.random() * heartCanvas.width,

          y: Math.random() * heartCanvas.height + heartCanvas.height,

          size: Math.random() * 7 + 5,

          speed: Math.random() * 0.7 + 0.3,

          drift: (Math.random() - 0.5) * 0.4,

          opacity: Math.random() * 0.35 + 0.15,
        });
      }

      /* =========================================================
   DRAW HEART
========================================================= */

      function drawHeart(ctx, x, y, size, opacity) {
        ctx.save();

        ctx.translate(x, y);

        ctx.beginPath();

        ctx.moveTo(0, size * 0.3);

        ctx.bezierCurveTo(
          -size,
          -size * 0.3,
          -size * 0.8,
          -size,
          0,
          -size * 0.35,
        );

        ctx.bezierCurveTo(size * 0.8, -size, size, -size * 0.3, 0, size * 0.3);

        ctx.closePath();

        ctx.fillStyle = `rgba(
            255,
            145,
            195,
            ${opacity}
        )`;

        ctx.fill();

        ctx.restore();
      }

      /* =========================================================
   START HEARTS
========================================================= */

      function startHearts() {
        if (heartsStarted) {
          return;
        }

        heartsStarted = true;

        function animateHearts() {
          if (!letterRevealed) {
            return;
          }

          heartCtx.clearRect(0, 0, heartCanvas.width, heartCanvas.height);

          hearts.forEach((heart) => {
            drawHeart(heartCtx, heart.x, heart.y, heart.size, heart.opacity);

            heart.y -= heart.speed;

            heart.x += heart.drift;

            if (heart.y < -30) {
              heart.y = heartCanvas.height + 30;

              heart.x = Math.random() * heartCanvas.width;
            }
          });

          requestAnimationFrame(animateHearts);
        }

        animateHearts();
      }

      /* =========================================================
   🎵 AUTOPLAY FALLBACK
========================================================= */

      window.addEventListener(
        "click",
        () => {
          if (letterRevealed && !isPlaying) {
            tryPlayMusic();
          }
        },
        {
          passive: true,
        },
      );
    </script>
  </body>
</html>
